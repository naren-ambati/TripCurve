# The tripcurve GitHub Action. Written and checked as a file only: it has never run on
# GitHub. The SARIF upload is opt-in (`upload-sarif: "true"`), off by default.
# All shell logic is in action/run.sh. No input is ever interpolated into a script body: each one
# arrives as an environment variable.
name: tripcurve
description: Checks that timeouts between infrastructure layers are ordered correctly.

inputs:
  path:
    description: Directory (or "-" for stdin) to check.
    default: "."
  config:
    description: Optional path of a tripcurve.yaml file.
    required: false
  format:
    description: "Report format for the log: human, json or sarif."
    default: human
  sarif-file:
    description: SARIF output file, relative to the workspace.
    default: tripcurve.sarif
  upload-sarif:
    description: 'Set to "true" to upload the SARIF file to GitHub code scanning. Needs security-events write in the calling workflow, and a public repository or GitHub code security.'
    default: "false"

outputs:
  sarif-file:
    description: Path of the SARIF file; set only when it was written and checked.
    value: ${{ steps.check.outputs.sarif-file }}
  exit-code:
    description: Exit code of the tripcurve run (0, 1, 2 or 3; 127 or above when it could not run). Always set.
    value: ${{ steps.check.outputs.exit-code || steps.build.outputs.exit-code }}

runs:
  using: composite
  steps:
    # setup-node v7.1.0, commit looked up 2026-11-12 (docs/lookups-b9.txt)
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22.12"

    # The CLI comes from the Action's own checkout, never from a registry at run time.
    - id: build
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/action/run.sh" build

    - id: check
      shell: bash
      env:
        TRIPCURVE_PATH: ${{ inputs.path }}
        TRIPCURVE_CONFIG: ${{ inputs.config }}
        TRIPCURVE_FORMAT: ${{ inputs.format }}
        TRIPCURVE_SARIF_FILE: ${{ inputs.sarif-file }}
      run: bash "$GITHUB_ACTION_PATH/action/run.sh" check

    # Opt-in upload (B19): runs only when the caller sets upload-sarif to "true" and a SARIF file was
    # written. `always()` is required: a step without a status check function gets the default
    # `success()` and is skipped after the check step failed, which is when findings matter
    # (GitHub docs, expressions, "Status check functions", read 2026-11-13: docs/lookups-b19.txt).
    # It needs `security-events: write` in the calling workflow; see docs/action.md.
    # codeql-action v4.39.3, commit looked up 2026-11-12.
    - if: ${{ always() && inputs.upload-sarif == 'true' && steps.check.outputs.sarif-file != '' }}
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ steps.check.outputs.sarif-file }}
