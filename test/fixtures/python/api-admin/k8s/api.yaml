apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: example/api:1
          command:
            - gunicorn
            - "api:app"
            - "-k"
            - "uvicorn_worker.UvicornWorker"
            - "-w"
            - "4"
          ports:
            - containerPort: 8000
