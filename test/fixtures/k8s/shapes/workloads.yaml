apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: db
          image: example/db:1
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: ops
spec:
  template:
    metadata:
      labels: {app: agent}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: agent
          image: example/agent:1
---
apiVersion: v1
kind: Pod
metadata:
  name: lonely
  labels:
    app: lonely
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: main
      image: example/main:1
      lifecycle:
        preStop:
          sleep:
            seconds: 7
---
apiVersion: batch/v1
kind: Job
metadata:
  name: not-a-workload
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm
data:
  key: value
