apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream
spec:
  selector:
    matchLabels:
      app: stream
  template:
    metadata:
      labels:
        app: stream
    spec:
      containers:
        - name: app
          image: node:22.23
          ports:
            - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: stream
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-attributes: "load_balancing.cross_zone.enabled=true"
spec:
  type: LoadBalancer
  selector:
    app: stream
  ports:
    - name: tcp
      port: 443
      targetPort: 9000
    - port: 80
      targetPort: http
    - port: 81
