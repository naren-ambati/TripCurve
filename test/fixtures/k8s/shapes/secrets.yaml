apiVersion: v1
kind: Secret
metadata:
  name: creds
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: LEAKED-LAST-APPLIED
data:
  password: LEAKED-DATA
stringData:
  token: LEAKED-STRING-DATA
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uses-secret
spec:
  template:
    spec:
      containers:
        - name: app
          image: example/app:1
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: LEAKED-SECRET-NAME
                  key: LEAKED-SECRET-KEY
            - name: CFG
              valueFrom:
                configMapKeyRef:
                  name: LEAKED-CONFIGMAP-NAME
                  key: LEAKED-CONFIGMAP-KEY
          envFrom:
            - secretRef:
                name: LEAKED-ENVFROM-NAME
