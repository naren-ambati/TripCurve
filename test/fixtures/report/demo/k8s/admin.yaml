apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: shop
spec:
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: example/admin:1
          command: ["gunicorn", "admin:app", "-w", "2"]
          ports:
            - containerPort: 8000
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
      terminationGracePeriodSeconds: 45
