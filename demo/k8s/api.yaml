apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: example/api:1
          imagePullPolicy: IfNotPresent
          # FastAPI app, served by gunicorn with the uvicorn worker
          command: ["gunicorn", "api:app", "-k", "uvicorn_worker.UvicornWorker", "-w", "4"]
          ports:
            - name: http
              containerPort: 8000
